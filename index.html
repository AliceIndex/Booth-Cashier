<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Booth Cashier</title>
    <link rel="stylesheet" href="css/index.css">
</head>

<body>
    <a href="cashier.html" class="cashier-link">会計へ</a>

    <header class="site-header">
        <h1>Booth Cashier</h1>
        <p>商品をクリックして選択してください</p>
    </header>

    <main class="main-flex">
        <section id="item-section" class="item-list-section">
            <h2>商品一覧</h2>
            <div id="item-list" class="tile-container"></div>
        </section>

        <aside class="selected-list">
            <h2>選択中の商品</h2>
            <h3>フード</h3>
            <ul id="selected-food-list"></ul>
            <h3>ドリンク</h3>
            <ul id="selected-drink-list"></ul>
            <div class="clear-btn-wrap">
                <button id="clear-selected" class="calc-btn" type="button">選択をクリア</button>
            </div>
        </aside>
    </main>

    <script src="js/common.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/contents.js"></script>

    <script>
        function renderSelectedList() {
            const foods = Cart.getItems('food');
            const drinks = Cart.getItems('drink');
            const foodList = document.getElementById('selected-food-list');
            const drinkList = document.getElementById('selected-drink-list');

            foodList.innerHTML = foods.map((it, idx) => {
                return `<li><button class="cancel-btn" onclick="cancelSelected('food', ${idx})" title="キャンセル">×</button> ${it.name}（￥${it.price}）</li>`;
            }).join('') || '<li>商品が選択されていません</li>';

            drinkList.innerHTML = drinks.map((it, idx) => {
                const optStr = it.option ? `（${it.option}）` : '';
                return `<li><button class="cancel-btn" onclick="cancelSelected('drink', ${idx})" title="キャンセル">×</button> ${it.name}${optStr}（￥${it.price}）</li>`;
            }).join('') || '<li>商品が選択されていません</li>';
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderSelectedList();
            document.getElementById('clear-selected').addEventListener('click', () => {
                Cart.clearAll();
                renderSelectedList();
            });
        });

        window.renderSelectedList = renderSelectedList;
    </script>
</body>

</html>
